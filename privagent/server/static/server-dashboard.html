<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PrivAgent — Server Console</title>
<style>
  :root {
    --bg-0: #060d16; --bg-2: #0e1f2e; --cyan: #00e5ff; --cyan-dim: rgba(0,229,255,0.25);
    --text-0: #eaf7fb; --text-1: #9fb8c4; --green: #34d399; --red: #f87171; --amber: #fbbf24;
    --border: rgba(0,229,255,0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-0);
    background: radial-gradient(circle at top, var(--bg-2), var(--bg-0) 75%); min-height: 100vh;
  }
  .wrap { max-width: 1020px; margin: 0 auto; padding: 30px 24px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .brand { font-size: 22px; font-weight: 800; color: var(--cyan); }
  .brand span { display: block; font-size: 12px; color: var(--text-1); font-weight: 400; margin-top: 3px; }
  .pulse { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--green); font-weight: 700; }
  .pulse-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-1); }
  .stat-value { font-size: 26px; font-weight: 800; margin-top: 6px; }
  .stat-value.raw { color: var(--green); }
  .stat-value.blocked { color: var(--red); }

  .panel { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-1); margin: 0 0 12px 0; }

  .req-list { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; }
  .req-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: rgba(255,255,255,0.02); }
  .req-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-1); margin-bottom: 6px; }
  .req-status { font-weight: 700; font-size: 12px; }
  .req-status.SECURE, .req-status.SANITIZED, .req-status.PLAN_GENERATED { color: var(--green); }
  .req-status.BLOCKED, .req-status.INJECTION_BLOCKED { color: var(--red); }
  pre.req-payload { margin: 8px 0 0; font-size: 11px; background: #04090f; padding: 10px; border-radius: 8px; overflow-x: auto; color: #b7f5ff; }
  .checkline { font-size: 12px; color: var(--green); margin-top: 6px; }
  .empty { font-size: 12px; color: var(--text-1); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">🛡 PRIVAGENT <span>Server Console</span></div>
    <div class="pulse"><span class="pulse-dot"></span> SERVER ONLINE</div>
  </header>

  <section class="stat-row">
    <div class="stat-card"><div class="stat-label">Requests</div><div class="stat-value" id="sRequests">0</div></div>
    <div class="stat-card"><div class="stat-label">Sanitized Requests</div><div class="stat-value" id="sSanitized">0</div></div>
    <div class="stat-card"><div class="stat-label">Raw PII Received</div><div class="stat-value raw" id="sRawPii">0</div></div>
    <div class="stat-card"><div class="stat-label">Blocked Requests</div><div class="stat-value blocked" id="sBlocked">0</div></div>
    <div class="stat-card"><div class="stat-label">Plans Generated</div><div class="stat-value" id="sPlans">0</div></div>
  </section>

  <section class="panel">
    <h2>Live Requests (most recent first)</h2>
    <div id="reqList" class="req-list">
      <div class="empty">Waiting for the extension to send a sanitized context…</div>
    </div>
  </section>
</div>
<script>
async function refresh() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    document.getElementById('sRequests').textContent = data.requests_received;
    document.getElementById('sSanitized').textContent = data.sanitized_requests;
    document.getElementById('sRawPii').textContent = data.raw_pii_received;
    document.getElementById('sBlocked').textContent = data.blocked_requests;
    document.getElementById('sPlans').textContent = data.plans_generated;

    const list = document.getElementById('reqList');
    if (!data.recent_requests || data.recent_requests.length === 0) {
      list.innerHTML = '<div class="empty">Waiting for the extension to send a sanitized context…</div>';
      return;
    }
    list.innerHTML = data.recent_requests.map((r) => `
      <div class="req-item">
        <div class="req-head">
          <span>#${r.request_id} · ${r.task} · ${r.page}</span>
          <span class="req-status ${r.status}">${r.status}</span>
        </div>
        ${r.payload ? `<pre class="req-payload">${JSON.stringify(r.payload.fields || {}, null, 2)}</pre>
        <div class="checkline">✓ PRIVACY CHECK PASSED &nbsp; ✓ ZERO RAW PII TRANSMITTED</div>` : ''}
        ${r.reason ? `<div style="color:#f87171; font-size:12px; margin-top:6px;">Reason: ${r.reason}</div>` : ''}
      </div>
    `).join('');
  } catch (e) {
    document.querySelector('.pulse').innerHTML = '<span class="pulse-dot" style="background:#f87171"></span> CONNECTION LOST';
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
